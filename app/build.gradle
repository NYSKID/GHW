plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file("signing.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    compileSdk 33
    namespace "com.mediatek.game"

    defaultConfig {
        applicationId "com.mediatek.game"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // Enable vector drawable support for smooth meter rendering
        vectorDrawables.useSupportLibrary = true

        // Enable multidex for larger apps
        multiDexEnabled true
    }

    // signing configuration: read from signing.properties, else from env vars
    signingConfigs {
        release {
            def storeFilePath = keystoreProps.getProperty('storeFile') ?: System.getenv('RELEASE_KEYSTORE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
            }

            storePassword keystoreProps.getProperty('storePassword') ?: System.getenv('KEYSTORE_PASSWORD')
            keyAlias     keystoreProps.getProperty('keyAlias')     ?: System.getenv('KEY_ALIAS')
            keyPassword  keystoreProps.getProperty('keyPassword')  ?: System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    bundle {
        language.enableSplit = false
        density.enableSplit = false
        abi.enableSplit = false
    }

    lintOptions {
        checkReleaseBuilds false
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'

    // AndroidX & support libraries
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle / runtime
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.5.5'

    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.8.0'

    // Optional: graphics/core for advanced rendering (keep only if needed)
    // implementation 'androidx.graphics:graphics-core:1.0.0'
}
